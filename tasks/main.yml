---

- name: "Check critical variables are defined."
  assert:
    that:
      - container_user is defined
      - container_group is defined
      - container_friendly_name is defined
      - container_prefix is defined
      - image_name is defined
      - container_home_url is defined
      - quadlet_path is defined
      - mqtt_bind_address is defined

- name: TLS certificate paths must be inside the mounted /etc/letsencrypt
  assert:
    that:
      - mqtt_tls_certfile is match('/etc/letsencrypt/')
      - mqtt_tls_keyfile is match('/etc/letsencrypt/')
    fail_msg: "mqtt_tls_certfile and mqtt_tls_keyfile must live under /etc/letsencrypt, the only tree mounted into the container at /ssl."
  when: mqtt_tls_enabled | bool

- import_tasks: install.yml
  tags: [service_install_binary]

- import_tasks: config.yml
  tags: [service_install_config]

- name: Deploy Mosquitto Quadlet container file
  template:
    src: mosquitto.container.j2
    dest: "{{ quadlet_path }}/{{ container_friendly_name }}.container"
    mode: 0644
    owner: "{{ container_user }}"
    group: "{{ container_group }}"
  tags: [service_install_binary]
