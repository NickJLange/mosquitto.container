---

mqtt_user: "mqtt"
mqtt_group: "mqtt"

mqtt_system_prefix: "/usr/local"
mqtt_prefix: "{{ mqtt_system_prefix }}/mosquitto"
mqtt_conf_dir: "{{ mqtt_prefix }}/etc/"
# May not need
mqtt_system_conf_dir: "{{ mqtt_system_prefix }}/etc/"
mqtt_env_file: "{{ mqtt_prefix }}/envfile.conf"
podman_path: "/usr/bin/podman"
systemd_dir: "/etc/systemd/system"

image_name: "docker.io/eclipse-mosquitto:latest"
service_name: "mosquitto"

 
# TLS listener on 8883 alongside plain MQTT on 1883; off until certs are rolled out
mqtt_tls_enabled: false
mqtt_tls_port: 8883
mqtt_tls_certfile: /etc/letsencrypt/server.cert
mqtt_tls_keyfile: /etc/letsencrypt/server.key
# Rendered as AssertPathExists= and checked at deploy, only when TLS is on
container_required_paths: "{{ [mqtt_tls_certfile, mqtt_tls_keyfile] if mqtt_tls_enabled | bool else [] }}"
